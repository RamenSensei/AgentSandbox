name: Conformance

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap (verified OS sandbox for shell steps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run conformance suite
        run: cargo test -p ak-conformance -- --nocapture
      - name: Run adversarial bench
        run: cargo run -p ak-adversarial-bench -- --report target/adversarial-report.json
      - name: Run agent utility bench
        run: cargo run -p ak-agent-utility-bench -- --report target/utility-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-report
          path: target/adversarial-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: utility-report
          path: target/utility-report.json
