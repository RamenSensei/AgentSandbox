// AgentKernel Execution Protocol — episodes, steps and branches.
//
// Mirrors ak-core kernel/core/src/{action,observation}.rs plus the episode /
// branch surface of the kernel API server.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protocol/capability.proto";
import "protocol/effect.proto";
import "protocol/trace.proto";

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

// The action taxonomy. Every variant is a *semantic* request; the kernel —
// not the agent — decides which isolation backend executes it.
// JSON: internally tagged with "kind" ("shell" | "read_file" | "write_file" |
// "delete_path" | "http_read" | "mcp_invoke" | "connector_op" |
// "trace_query" | "branch_diff").
message ActionKind {
  oneof kind {
    ActionShell shell = 1;
    ActionReadFile read_file = 2;
    ActionWriteFile write_file = 3;
    ActionDeletePath delete_path = 4;
    ActionHttpRead http_read = 5;
    ActionMcpInvoke mcp_invoke = 6;
    ActionConnectorOp connector_op = 7;
    ActionTraceQuery trace_query = 8;
    ActionBranchDiff branch_diff = 9;
  }
}

message ActionShell {
  string command = 1;
  optional string cwd = 2;
  map<string, string> env = 3;
}
message ActionReadFile {
  string path = 1;
}
message ActionWriteFile {
  string path = 1;
  string contents_b64 = 2;
}
message ActionDeletePath {
  string path = 1;
}
message ActionHttpRead {
  string url = 1;
}
message ActionMcpInvoke {
  string server = 1;
  string tool = 2;
  google.protobuf.Value arguments = 3;
}
// Never executed inline: the kernel turns it into a proposed effect.
message ActionConnectorOp {
  string connector = 1;
  string operation = 2;
  google.protobuf.Value params = 3;
}
message ActionTraceQuery {
  string query = 1;
}
message ActionBranchDiff {
  string since = 1; // "st-..."
}

// A fully-specified execution request from a principal.
message Action {
  ActionKind kind = 1;
  // Lease presented as authority for this action. No ambient authority.
  string lease = 2; // "lease-..."
  // Used ONLY for scheduling and audit narration — never for authorization.
  optional string intent_hint = 3;
  ResourceBudget budget = 4;
}

// ---------------------------------------------------------------------------
// Observations
// ---------------------------------------------------------------------------

// JSON: internally tagged with "kind" ("success" | "failure" | "denied" |
// "effect_pending" | "effect_committed").
message Observation {
  oneof kind {
    ObservationSuccess success = 1;
    ObservationFailure failure = 2;
    ObservationDenied denied = 3;
    ObservationEffectPending effect_pending = 4;
    ObservationEffectCommitted effect_committed = 5;
  }
}

message ObservationSuccess {
  string summary = 1;
  optional google.protobuf.Value data = 2;
  optional string stdout_head = 3;
  int32 exit_code = 4;
  // Full output is addressable in the ledger via this hash.
  string full_output = 5; // "sha256:..."
  bool truncated = 6;
}
message ObservationFailure {
  string summary = 1;
  int32 exit_code = 2;
  optional string first_causal_failure = 3;
  string full_output = 4;
}
message ObservationDenied {
  Denial denial = 1;
}
message ObservationEffectPending {
  string effect = 1; // "fx-..."
  string contract_hash = 2;
  EffectClass class = 3;
}
message ObservationEffectCommitted {
  string receipt = 1; // "rcpt-..."
}

// ---------------------------------------------------------------------------
// Episodes
// ---------------------------------------------------------------------------

message Episode {
  string id = 1; // "ep-..."
  string title = 2;
  string owner = 3; // "pr-..."
  string root_state = 4; // "st-..."
  // The default branch created with the episode.
  string main_branch = 5; // "br-..."
  ResourceBudget budget = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Branch {
  string id = 1; // "br-..."
  string episode = 2; // "ep-..."
  optional string parent_branch = 3; // "br-..."
  string forked_from = 4; // "st-..."
  string head = 5; // "st-..."
  bool discarded = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EpisodeCreateRequest {
  string title = 1;
  string owner = 2; // "pr-..."
  ResourceBudget budget = 3;
  // Optional initial workspace, as a content-addressed tree root.
  optional string workspace_root = 4; // "sha256:..."
}

message EpisodeCreateResponse {
  Episode episode = 1;
  Branch main_branch = 2;
}

message EpisodeDescribeRequest {
  string episode = 1; // "ep-..."
}

message EpisodeDescribeResponse {
  Episode episode = 1;
  repeated Branch branches = 2;
  uint32 step_count = 3;
  uint32 pending_effects = 4;
  ResourceBudget budget_remaining = 5;
}

// ---------------------------------------------------------------------------
// Steps
// ---------------------------------------------------------------------------

message StepExecuteRequest {
  string branch = 1; // "br-..."
  string actor = 2; // "pr-..."
  Action action = 3;
}

message StepExecuteResponse {
  string step = 1; // "step-..."
  Observation observation = 2;
  // State node produced by this step (absent when the step was denied and
  // produced no transition — no invisible state transitions).
  optional string produced_state = 3; // "st-..."
  ResourceBudget usage = 4;
}

message StepExplainRequest {
  string step = 1; // "step-..."
}

// Why the kernel did what it did: the full authorization narrative.
message StepExplainResponse {
  TraceEntry entry = 1;
  // The lease presented, as recorded at execution time.
  CapabilityLease lease = 2;
  // Constraint checks performed: parameter name -> outcome narrative.
  map<string, string> constraint_checks = 3;
  // Chosen isolation backend and why.
  string backend = 4;
  string backend_rationale = 5;
}
