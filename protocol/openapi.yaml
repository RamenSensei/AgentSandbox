openapi: 3.1.0
info:
  title: AgentKernel Execution Protocol — HTTP/JSON binding
  version: 0.7.0
  description: |
    JSON/HTTP binding of the AgentKernel Execution Protocol exposed by the
    kernel API server (kernel/api/src/http.rs). Wire objects use the
    canonical JSON encoding of ak-core (snake_case fields, internally
    tagged enums, prefixed string ids: ep-/step-/br-/st-/pr-/lease-/fx-/rcpt-).

    Authentication: every route except /healthz requires
    `Authorization: Bearer <token>` when the server runs with an auth
    config. Missing/invalid tokens are 401; principal spoofing, missing
    roles and non-ownership are 403. In disabled (loopback dev) mode
    request-body principals are trusted.

    Errors are returned as an ErrorEnvelope `{code, message, denial?}`.
    Policy denials are HTTP 403 with `code: "DENIED"` and the full
    structured Denial — never a bare "permission denied". A denial that was
    itself recorded as a step is also HTTP 403, with the recorded step,
    state and observation alongside the error envelope.
servers:
  - url: /
tags:
  - name: health
  - name: episodes
  - name: steps
  - name: branches
  - name: capabilities
  - name: effects
  - name: trace
  - name: replay
  - name: receipts

paths:
  /healthz:
    get:
      security: []
      tags: [health]
      operationId: health.check
      summary: Liveness probe.
      responses:
        "200":
          description: The kernel is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version: { type: string }

  /v1/episodes:
    post:
      tags: [episodes]
      operationId: episode.create
      summary: Create an episode with its root state and main branch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeCreateRequest" }
      responses:
        "201":
          description: Episode created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeCreateResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/episodes/{id}:
    get:
      tags: [episodes]
      operationId: episode.describe
      summary: Describe an episode, its branches and remaining budget.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Episode description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeDescription" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/execute:
    post:
      tags: [steps]
      operationId: step.execute
      summary: Execute one action on a branch as a principal.
      description: |
        Every action must present a lease (no ambient authority). A denied
        step is still recorded; the response is HTTP 403 carrying the
        recorded step, unchanged state, the "denied" observation and an
        ErrorEnvelope with the full structured Denial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepExecuteRequest" }
      responses:
        "200":
          description: The step ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepResult" }
        "403": { $ref: "#/components/responses/DeniedStep" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/execute_auto:
    post:
      tags: [steps]
      operationId: step.executeAuto
      summary: Execute one action with automatic lease resolution.
      description: |
        The caller sends only the action kind. The kernel finds the
        narrowest active lease authorizing the action on the branch, or
        mints one through the policy engine, clamps the step budget into
        the lease envelope, and executes. The response is the step result
        plus the lease used and whether it was freshly minted. Lease
        bookkeeping is deterministic control-plane work; it never belongs
        in a model's reasoning loop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepExecuteAutoRequest" }
      responses:
        "200":
          description: The step ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoStepResult" }
        "403": { $ref: "#/components/responses/DeniedStep" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/{id}/explain:
    get:
      tags: [steps]
      operationId: step.explain
      summary: Full causal narrative for a recorded step.
      parameters:
        - $ref: "#/components/parameters/StepId"
      responses:
        "200":
          description: Explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepExplanation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/{id}/retry:
    post:
      tags: [steps]
      operationId: step.retry
      summary: Re-execute a recorded step on its branch. No request body.
      parameters:
        - $ref: "#/components/parameters/StepId"
      responses:
        "200":
          description: Retry result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepResult" }
        "403": { $ref: "#/components/responses/DeniedStep" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/fork:
    post:
      tags: [branches]
      operationId: branch.fork
      summary: Fork one sibling branch from this branch's head. No request body.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: The forked branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/diff:
    post:
      tags: [branches]
      operationId: branch.diff
      summary: File changes on a branch since a state (default fork point).
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchDiffRequest" }
      responses:
        "200":
          description: File changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileChange" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/merge:
    post:
      tags: [branches]
      operationId: branch.merge
      summary: Merge a source branch into this branch.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchMergeRequest" }
      responses:
        "200":
          description: The merged state node on the destination branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateNode" }
        "409":
          description: Merge conflict (code MERGE_CONFLICT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/discard:
    post:
      tags: [branches]
      operationId: branch.discard
      summary: Discard a speculative branch and its backend resources. No request body.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [discarded]
                properties:
                  discarded: { type: string, pattern: "^br-" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/compare/{other}:
    get:
      tags: [branches]
      operationId: branch.compare
      summary: Compare two branches since their common ancestor.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: other
          in: path
          required: true
          schema: { type: string, pattern: "^br-" }
      responses:
        "200":
          description: Comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchCompareResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/explore:
    post:
      tags: [branches]
      operationId: branch.explore
      summary: Server-side parallel candidate exploration.
      description: |
        Forks one branch per candidate, executes each candidate's actions
        with automatic lease resolution under a parallelism cap, runs the
        optional evaluator, optionally merges the winner back and discards
        losers. The agent supplies candidates and the success criterion;
        the kernel does the fork/lease/collect/merge bookkeeping.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExploreRequest" }
      responses:
        "200":
          description: Exploration report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreReport" }
        default: { $ref: "#/components/responses/Error" }

  /v1/raw/{hash}:
    get:
      tags: [trace]
      operationId: raw.fetch
      summary: Paginated access to a full recorded output blob.
      description: |
        Observations reference full outputs by content hash
        (`full_output`); this route returns a byte-sliced page of the blob,
        or, with `grep`, line matches with byte offsets. Closes the loop
        between "the full output exists" and "the agent can actually read
        it".
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^sha256:" }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1048576 }
        - name: grep
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page (or grep matches) of the blob.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RawPage"
                  - $ref: "#/components/schemas/RawGrep"
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/request:
    post:
      tags: [capabilities]
      operationId: capability.request
      summary: Request a new capability lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityRequestRequest" }
      responses:
        "201":
          description: Lease granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityLease" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/compile_envelope:
    post:
      tags: [capabilities]
      operationId: capability.compileEnvelope
      summary: >
        Compile an autonomy envelope: request every capability a task needs
        in one call. Policy-allowed items mint leases immediately (the same
        leases execute_auto resolves); items needing a human or refused come
        back as structured denials. Policy outcomes never fail the call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompileEnvelopeRequest" }
      responses:
        "200":
          description: Per-request grants and denials, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeReport" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/delegate:
    post:
      tags: [capabilities]
      operationId: capability.delegate
      summary: Attenuate a lease for a delegatee principal. Never widens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityDelegateRequest" }
      responses:
        "201":
          description: Child lease.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityLease" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/revoke:
    post:
      tags: [capabilities]
      operationId: capability.revoke
      summary: Revoke a lease and its delegation subtree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties:
                lease: { type: string, pattern: "^lease-" }
      responses:
        "200":
          description: Revoked lease ids (the lease and every descendant).
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: array
                    items: { type: string, pattern: "^lease-" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/{principal}:
    get:
      tags: [capabilities]
      operationId: capability.list
      summary: List the active leases currently held by a principal.
      parameters:
        - name: principal
          in: path
          required: true
          schema: { type: string, pattern: "^pr-" }
      responses:
        "200":
          description: Active leases.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CapabilityLease" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects:
    get:
      tags: [effects]
      operationId: effect.list
      summary: List pending effects, optionally filtered by phase.
      parameters:
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum: [proposed, prepared, approved, committing, committed,
                   aborted, compensated]
      responses:
        "200":
          description: Effects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingEffect" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/recover:
    post:
      tags: [effects]
      operationId: effect.recover
      summary: >
        Run in-doubt recovery: resolve effects parked in phase "committing"
        through each connector's idempotency probe. No request body.
      responses:
        "200":
          description: Per-effect resolutions.
          content:
            application/json:
              schema:
                type: object
                required: [resolutions]
                properties:
                  resolutions:
                    type: array
                    items:
                      type: object
                      required: [effect, resolution]
                      properties:
                        effect: { type: string, pattern: "^fx-" }
                        resolution: {}
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}:
    get:
      tags: [effects]
      operationId: effect.get
      summary: Fetch a pending or resolved effect.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: The effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEffect" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/prepare:
    post:
      tags: [effects]
      operationId: effect.prepare
      summary: Dry-run the effect against the live world. No side effects, no request body.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: Preview and observed preconditions.
          content:
            application/json:
              schema:
                type: object
                required: [preview, observed_preconditions]
                properties:
                  preview: {}
                  observed_preconditions: {}
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/approve:
    post:
      tags: [effects]
      operationId: effect.approve
      summary: Record an approval of the effect's current contract.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver]
              properties:
                approver: { type: string, pattern: "^pr-" }
      responses:
        "200":
          description: Acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved: { type: string, pattern: "^fx-" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/commit:
    post:
      tags: [effects]
      operationId: effect.commit
      summary: Commit the effect after commit-time revalidation. No request body.
      description: |
        Revalidates lease, preconditions, policy epoch and contract hash
        before touching the world. Stale authorization, duplicate commits
        and wrong-phase commits are HTTP 409 with the corresponding error
        code (STALE_AUTHORIZATION, DUPLICATE_COMMIT, COMMIT_IN_DOUBT,
        WRONG_EFFECT_PHASE).
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: Signed receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: Stale authorization, duplicate or in-doubt commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/compensate:
    post:
      tags: [effects]
      operationId: effect.compensate
      summary: Run the compensating action for a committed effect. No request body.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: Compensating receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/resolve:
    post:
      tags: [effects]
      operationId: effect.resolve
      summary: Operator verdict on an in-doubt effect.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorResolution" }
      responses:
        "200":
          description: Resolution acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: { type: string, pattern: "^fx-" }
                  receipt:
                    oneOf:
                      - { $ref: "#/components/schemas/Receipt" }
                      - { type: "null" }
        default: { $ref: "#/components/responses/Error" }

  /v1/replay/{mode}:
    post:
      tags: [replay]
      operationId: replay.run
      summary: Replay in audit, sandbox or live mode.
      description: |
        audit — play back the recorded ledger sequence range; never
        re-executes. Requires seq_from/seq_to (defaults: whole ledger).
        sandbox — re-execute one recorded step in an isolated fork.
        Requires `step`.
        live — re-commit one recorded effect contract against the real
        world. Requires `effect` and `approver`. Live replay guarantees
        the contract, not the outcome.
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [audit, sandbox, live] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayRequest" }
      responses:
        "200":
          description: >
            Mode-specific result: audit returns {mode, events}; sandbox
            returns a ReplaySandboxReport; live returns the new Receipt.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReplayAuditResponse"
                  - $ref: "#/components/schemas/ReplaySandboxReport"
                  - $ref: "#/components/schemas/Receipt"
        default: { $ref: "#/components/responses/Error" }

  /v1/trace/query:
    get:
      tags: [trace]
      operationId: trace.query
      summary: Query the causal ledger.
      parameters:
        - name: episode
          in: query
          required: false
          schema: { type: string, pattern: "^ep-" }
        - name: branch
          in: query
          required: false
          schema: { type: string, pattern: "^br-" }
        - name: step
          in: query
          required: false
          schema: { type: string, pattern: "^step-" }
        - name: principal
          in: query
          required: false
          schema: { type: string, pattern: "^pr-" }
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: Ledger event kind, e.g. step_started, effect_committed.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Matching ledger events, in causal order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEvent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/receipts/{id}:
    get:
      tags: [receipts]
      operationId: receipt.get
      summary: Fetch a signed receipt.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^rcpt-" }
      responses:
        "200":
          description: Receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Error" }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static API token mapped to a principal and role set.
  parameters:
    EpisodeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^ep-" }
    StepId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^step-" }
    BranchId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^br-" }
    EffectId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^fx-" }

  responses:
    Denied:
      description: >
        Policy denial. Always carries the full structured Denial so a benign
        agent can repair itself (invariant: no denial without a
        machine-readable explanation).
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - required: [denial]
    DeniedStep:
      description: >
        The step was admitted and recorded, but the action was denied. The
        body carries the recorded step, the unchanged branch head state,
        the "denied" observation and the error envelope with the full
        structured Denial.
      content:
        application/json:
          schema:
            type: object
            required: [step, state, observation, error]
            properties:
              step: { type: string, pattern: "^step-" }
              state: { type: string, pattern: "^st-" }
              observation: { $ref: "#/components/schemas/Observation" }
              error:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - required: [denial]
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable machine code, e.g. INVALID_ID, NOT_FOUND, DENIED,
            WRONG_EFFECT_PHASE, STALE_AUTHORIZATION, DUPLICATE_COMMIT,
            COMMIT_IN_DOUBT, BACKEND_UNAVAILABLE, BRANCH_DISCARDED,
            MERGE_CONFLICT, STORAGE, CONNECTOR, SERDE, IO, OTHER.
        message: { type: string }
        denial: { $ref: "#/components/schemas/Denial" }

    ResourceBudget:
      type: object
      required:
        [cpu_ms, memory_bytes, network_bytes, tokens, cost_micro_usd, risk_units]
      properties:
        cpu_ms: { type: integer, minimum: 0 }
        memory_bytes: { type: integer, minimum: 0 }
        network_bytes: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        cost_micro_usd: { type: integer, minimum: 0 }
        risk_units: { type: integer, minimum: 0 }

    Constraint:
      description: Internally tagged by "kind" (ak-core Constraint).
      oneOf:
        - type: object
          required: [kind, value]
          properties:
            kind: { const: equals }
            value: {}
        - type: object
          required: [kind, values]
          properties:
            kind: { const: one_of }
            values: { type: array }
        - type: object
          required: [kind, pattern]
          properties:
            kind: { const: glob }
            pattern: { type: string }
        - type: object
          required: [kind, prefix]
          properties:
            kind: { const: prefix }
            prefix: { type: string }
        - type: object
          required: [kind, max]
          properties:
            kind: { const: max }
            max: { type: number }
        - type: object
          required: [kind]
          properties:
            kind: { const: forbidden }

    CapabilityLease:
      type: object
      required:
        [id, principal, operation, constraints, remaining_uses, issued_at,
         expires_at, budget, revoked]
      properties:
        id: { type: string, pattern: "^lease-" }
        principal: { type: string, pattern: "^pr-" }
        operation: { type: string }
        constraints:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Constraint" }
        remaining_uses: { type: integer, minimum: 0 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        bound_branch: { type: string, pattern: "^br-" }
        budget: { $ref: "#/components/schemas/ResourceBudget" }
        parent_lease: { type: string, pattern: "^lease-" }
        preconditions: { type: object }
        revoked: { type: boolean }

    DenialCode:
      type: string
      enum:
        - CAPABILITY_DENIED
        - CAPABILITY_EXPIRED
        - CAPABILITY_EXHAUSTED
        - BUDGET_EXHAUSTED
        - CONSTRAINT_VIOLATED
        - BRANCH_MISMATCH
        - EFFECT_REQUIRES_APPROVAL
        - STALE_AUTHORIZATION
        - PRECONDITION_FAILED
        - DUPLICATE_COMMIT
        - BACKEND_UNAVAILABLE
        - POLICY_FORBIDDEN

    RequestableScope:
      type: object
      required: [operation, constraints, requires_human]
      properties:
        operation: { type: string }
        constraints: {}
        requires_human: { type: boolean }

    Denial:
      type: object
      required: [code, attempted_operation, reason, escalation_allowed]
      properties:
        code: { $ref: "#/components/schemas/DenialCode" }
        attempted_operation: { type: string }
        reason: { type: string }
        safe_alternatives:
          type: array
          items: { type: string }
        requestable_scopes:
          type: array
          items: { $ref: "#/components/schemas/RequestableScope" }
        escalation_allowed: { type: boolean }

    ActionKind:
      description: Internally tagged by "kind" (ak-core ActionKind).
      oneOf:
        - type: object
          required: [kind, command]
          properties:
            kind: { const: shell }
            command: { type: string }
            cwd: { type: [string, "null"] }
            env:
              type: object
              additionalProperties: { type: string }
        - type: object
          required: [kind, path]
          properties:
            kind: { const: read_file }
            path: { type: string }
        - type: object
          required: [kind, path, contents_b64]
          properties:
            kind: { const: write_file }
            path: { type: string }
            contents_b64: { type: string }
        - type: object
          required: [kind, path]
          properties:
            kind: { const: delete_path }
            path: { type: string }
        - type: object
          required: [kind, command]
          properties:
            kind: { const: process_start }
            command: { type: string }
            cwd: { type: [string, "null"] }
            env:
              type: object
              additionalProperties: { type: string }
            name: { type: [string, "null"] }
        - type: object
          required: [kind, process, data_b64]
          properties:
            kind: { const: process_stdin }
            process: { type: string, pattern: "^proc-" }
            data_b64: { type: string }
            close: { type: boolean }
        - type: object
          required: [kind, process]
          properties:
            kind: { const: process_logs }
            process: { type: string, pattern: "^proc-" }
            from_offset: { type: integer, minimum: 0 }
            max_bytes: { type: [integer, "null"] }
        - type: object
          required: [kind, process, signal]
          properties:
            kind: { const: process_signal }
            process: { type: string, pattern: "^proc-" }
            signal: { type: string, enum: [int, term, kill] }
        - type: object
          required: [kind]
          properties:
            kind: { const: process_status }
            process:
              type: string
              description: Empty string lists every session on the branch.
        - type: object
          required: [kind, url]
          properties:
            kind: { const: http_read }
            url: { type: string }
        - type: object
          required: [kind, server, tool, arguments]
          properties:
            kind: { const: mcp_invoke }
            server: { type: string }
            tool: { type: string }
            arguments: {}
        - type: object
          required: [kind, connector, operation, params]
          properties:
            kind: { const: connector_op }
            connector: { type: string }
            operation: { type: string }
            params: {}
        - type: object
          required: [kind, query]
          properties:
            kind: { const: trace_query }
            query: { type: string }
        - type: object
          required: [kind, since]
          properties:
            kind: { const: branch_diff }
            since: { type: string, pattern: "^st-" }

    Action:
      type: object
      required: [kind, lease, budget]
      properties:
        kind: { $ref: "#/components/schemas/ActionKind" }
        lease: { type: string, pattern: "^lease-" }
        intent_hint: { type: string }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    Observation:
      description: Internally tagged by "kind" (ak-core Observation).
      oneOf:
        - type: object
          required: [kind, summary, exit_code, full_output, truncated]
          properties:
            kind: { const: success }
            summary: { type: string }
            data: {}
            stdout_head: { type: string }
            stdout_tail:
              type: string
              description: >
                Trailing bytes, present only when the middle was elided —
                test summaries and final errors live here.
            exit_code: { type: integer }
            full_output: { type: string }
            truncated: { type: boolean }
        - type: object
          required: [kind, summary, exit_code, full_output]
          properties:
            kind: { const: failure }
            summary: { type: string }
            exit_code: { type: integer }
            first_causal_failure: { type: string }
            output_tail: { type: string }
            full_output: { type: string }
        - type: object
          required: [kind, denial]
          properties:
            kind: { const: denied }
            denial: { $ref: "#/components/schemas/Denial" }
        - type: object
          required: [kind, effect, contract_hash, class]
          properties:
            kind: { const: effect_pending }
            effect: { type: string, pattern: "^fx-" }
            contract_hash: { type: string }
            class: { $ref: "#/components/schemas/EffectClass" }
        - type: object
          required: [kind, receipt]
          properties:
            kind: { const: effect_committed }
            receipt: { type: string, pattern: "^rcpt-" }

    EffectClass:
      type: string
      enum:
        - pure
        - local_reversible
        - remote_reversible
        - compensatable
        - irreversible
        - opaque_external

    EffectContract:
      type: object
      required:
        [operation, resource, arguments, preconditions, idempotency_key, class]
      properties:
        operation: { type: string }
        resource: { type: string }
        arguments: {}
        preconditions: {}
        idempotency_key: { type: string }
        class: { $ref: "#/components/schemas/EffectClass" }

    EffectPhase:
      description: Internally tagged by "phase" (ak-core EffectPhase).
      oneOf:
        - type: object
          required: [phase]
          properties:
            phase: { const: proposed }
        - type: object
          required: [phase, preview]
          properties:
            phase: { const: prepared }
            preview: {}
        - type: object
          required: [phase, approver, approved_at, policy_epoch]
          properties:
            phase: { const: approved }
            approver: { type: string, pattern: "^pr-" }
            approved_at: { type: string, format: date-time }
            policy_epoch: { type: integer }
        - type: object
          required: [phase]
          properties:
            phase: { const: committing }
        - type: object
          required: [phase, receipt]
          properties:
            phase: { const: committed }
            receipt: { type: string, pattern: "^rcpt-" }
        - type: object
          required: [phase, reason]
          properties:
            phase: { const: aborted }
            reason: { type: string }
        - type: object
          required: [phase, compensating_receipt]
          properties:
            phase: { const: compensated }
            compensating_receipt: { type: string, pattern: "^rcpt-" }

    PendingEffect:
      type: object
      required:
        [id, contract, contract_hash, proposer, branch, step, lease, phase,
         proposed_at]
      properties:
        id: { type: string, pattern: "^fx-" }
        contract: { $ref: "#/components/schemas/EffectContract" }
        contract_hash: { type: string }
        proposer: { type: string, pattern: "^pr-" }
        branch: { type: string, pattern: "^br-" }
        step: { type: string, pattern: "^step-" }
        lease: { type: string, pattern: "^lease-" }
        phase: { $ref: "#/components/schemas/EffectPhase" }
        proposed_at: { type: string, format: date-time }

    OperatorResolution:
      description: >
        Operator verdict on an in-doubt effect: either the external call
        committed (with its response) or it aborted.
      oneOf:
        - type: object
          required: [outcome, response]
          properties:
            outcome: { const: committed }
            response: {}
        - type: object
          required: [outcome, reason]
          properties:
            outcome: { const: aborted }
            reason: { type: string }

    ReceiptBody:
      type: object
      required:
        [effect, who, operation, resource, contract_hash, branch, step,
         policy_epoch, authorization_witness, external_response_digest,
         committed_at]
      properties:
        effect: { type: string, pattern: "^fx-" }
        who: { type: string, pattern: "^pr-" }
        operation: { type: string }
        resource: { type: string }
        contract_hash: { type: string }
        branch: { type: string, pattern: "^br-" }
        step: { type: string, pattern: "^step-" }
        policy_epoch: { type: integer }
        authorization_witness: { type: string }
        external_response_digest: { type: string }
        committed_at: { type: string, format: date-time }

    Receipt:
      type: object
      required: [id, body, signature, key_id]
      properties:
        id: { type: string, pattern: "^rcpt-" }
        body: { $ref: "#/components/schemas/ReceiptBody" }
        signature:
          type: string
          description: Ed25519 over canonical_json(body), hex-encoded.
        key_id: { type: string }

    FileChange:
      description: Internally tagged by "op" (ak-core FileChange).
      oneOf:
        - type: object
          required: [op, path, blob, mode]
          properties:
            op: { const: added }
            path: { type: string }
            blob: { type: string }
            mode: { type: integer }
        - type: object
          required: [op, path, old_blob, new_blob]
          properties:
            op: { const: modified }
            path: { type: string }
            old_blob: { type: string }
            new_blob: { type: string }
        - type: object
          required: [op, path, old_blob]
          properties:
            op: { const: deleted }
            path: { type: string }
            old_blob: { type: string }

    StateDelta:
      type: object
      required: [policy_epoch]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileChange" }
        processes_started:
          type: array
          items: { type: string }
        processes_exited:
          type: array
          items: { type: string }
        tool_sessions:
          type: array
          items: { type: string }
        policy_epoch: { type: integer }
        effects_proposed:
          type: array
          items: { type: string, pattern: "^fx-" }
        effects_committed:
          type: array
          items: { type: string, pattern: "^rcpt-" }

    ReplayClass:
      type: string
      enum:
        - audit_only
        - filesystem_only
        - process_and_filesystem
        - framework_host_calls
        - browser_profile

    StateNode:
      type: object
      required:
        [id, episode, branch, actor, delta, workspace_root, replay_class,
         created_at]
      properties:
        id: { type: string, pattern: "^st-" }
        episode: { type: string, pattern: "^ep-" }
        branch: { type: string, pattern: "^br-" }
        parent: { type: string, pattern: "^st-" }
        produced_by: { type: string, pattern: "^step-" }
        merge_parent: { type: string, pattern: "^st-" }
        actor: { type: string, pattern: "^pr-" }
        delta: { $ref: "#/components/schemas/StateDelta" }
        workspace_root: { type: string }
        replay_class: { $ref: "#/components/schemas/ReplayClass" }
        created_at: { type: string, format: date-time }

    Branch:
      type: object
      required: [id, episode, forked_from, head, discarded, created_at]
      properties:
        id: { type: string, pattern: "^br-" }
        episode: { type: string, pattern: "^ep-" }
        parent_branch: { type: string, pattern: "^br-" }
        forked_from: { type: string, pattern: "^st-" }
        head: { type: string, pattern: "^st-" }
        discarded: { type: boolean }
        created_at: { type: string, format: date-time }

    EpisodeCreateRequest:
      type: object
      required: [principal]
      properties:
        principal: { type: string, pattern: "^pr-" }
        objective: { type: string, default: "" }
        workspace:
          type: [string, "null"]
          description: Workspace root path; the kernel allocates one when omitted.

    EpisodeCreateResponse:
      type: object
      required: [episode, branch, root_state]
      properties:
        episode: { type: string, pattern: "^ep-" }
        branch: { type: string, pattern: "^br-" }
        root_state: { type: string, pattern: "^st-" }

    EpisodeDescription:
      type: object
      required:
        [episode, root_branch, root_state, branches, created_by,
         remaining_budget]
      properties:
        episode: { type: string, pattern: "^ep-" }
        root_branch: { type: string, pattern: "^br-" }
        root_state: { type: string, pattern: "^st-" }
        branches:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        created_by: { type: string, pattern: "^pr-" }
        remaining_budget: { $ref: "#/components/schemas/ResourceBudget" }

    StepExecuteRequest:
      type: object
      required: [principal, branch, action]
      properties:
        principal: { type: string, pattern: "^pr-" }
        branch: { type: string, pattern: "^br-" }
        action: { $ref: "#/components/schemas/Action" }

    StepExecuteAutoRequest:
      type: object
      required: [principal, branch, kind]
      properties:
        principal: { type: string, pattern: "^pr-" }
        branch: { type: string, pattern: "^br-" }
        kind: { $ref: "#/components/schemas/ActionKind" }
        intent_hint: { type: string }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    AutoStepResult:
      allOf:
        - $ref: "#/components/schemas/StepResult"
        - type: object
          required: [lease, lease_minted]
          properties:
            lease: { type: string, pattern: "^lease-" }
            lease_minted:
              type: boolean
              description: Whether the lease was minted by this call.

    ExploreRequest:
      type: object
      required: [principal, candidates]
      properties:
        principal: { type: string, pattern: "^pr-" }
        candidates:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [actions]
            properties:
              name: { type: [string, "null"] }
              actions:
                type: array
                items: { $ref: "#/components/schemas/ActionKind" }
        evaluator: { $ref: "#/components/schemas/ActionKind" }
        max_parallel: { type: [integer, "null"], minimum: 1 }
        early_stop: { type: boolean, default: true }
        merge_winner: { type: boolean, default: false }
        discard_losers: { type: boolean, default: true }
        step_budget: { $ref: "#/components/schemas/ResourceBudget" }

    ExploreReport:
      type: object
      required: [source, candidates, discarded]
      properties:
        source: { type: string, pattern: "^br-" }
        winner: { type: [integer, "null"] }
        merged_state: { type: [string, "null"] }
        merge_error: { type: [string, "null"] }
        candidates:
          type: array
          items:
            type: object
            required: [index, steps, passed, skipped]
            properties:
              index: { type: integer }
              name: { type: [string, "null"] }
              branch: { type: [string, "null"] }
              steps:
                type: array
                items: { $ref: "#/components/schemas/StepResult" }
              evaluation:
                oneOf:
                  - { type: "null" }
                  - $ref: "#/components/schemas/StepResult"
              passed: { type: boolean }
              skipped: { type: boolean }
              error: { type: [string, "null"] }
        discarded:
          type: array
          items: { type: string, pattern: "^br-" }

    RawPage:
      type: object
      required: [hash, total_bytes, offset, returned_bytes, data]
      properties:
        hash: { type: string }
        total_bytes: { type: integer }
        offset: { type: integer }
        returned_bytes: { type: integer }
        next_offset: { type: [integer, "null"] }
        data: { type: string }

    RawGrep:
      type: object
      required: [hash, total_bytes, grep, matches, matches_truncated]
      properties:
        hash: { type: string }
        total_bytes: { type: integer }
        grep: { type: string }
        matches:
          type: array
          items:
            type: object
            required: [offset, line]
            properties:
              offset: { type: integer }
              line: { type: string }
        matches_truncated: { type: boolean }

    StepResult:
      type: object
      required: [step, state, observation]
      properties:
        step: { type: string, pattern: "^step-" }
        state:
          type: string
          pattern: "^st-"
          description: Branch head after the step (unchanged when denied).
        observation: { $ref: "#/components/schemas/Observation" }

    StepExplanation:
      type: object
      required:
        [step, episode, principal, policy_decisions, effects_proposed, events]
      properties:
        step: { type: string, pattern: "^step-" }
        episode: { type: string, pattern: "^ep-" }
        branch: { type: [string, "null"], pattern: "^br-" }
        principal: { type: string, pattern: "^pr-" }
        action:
          description: The invoked action as recorded.
        policy_decisions:
          type: array
          items: {}
        denial:
          oneOf:
            - $ref: "#/components/schemas/Denial"
            - { type: "null" }
        state: { type: [string, "null"], pattern: "^st-" }
        state_delta: {}
        observation: {}
        effects_proposed:
          type: array
          items: {}
        events:
          type: array
          items: { $ref: "#/components/schemas/LedgerEvent" }

    BranchDiffRequest:
      type: object
      properties:
        since: { type: string, pattern: "^st-" }

    BranchMergeRequest:
      type: object
      required: [source, actor]
      properties:
        source:
          type: string
          pattern: "^br-"
          description: The branch merged into the path branch.
        actor: { type: string, pattern: "^pr-" }

    BranchCompareResponse:
      type: object
      required: [base, changed_in_a, changed_in_b]
      properties:
        base:
          type: string
          pattern: "^st-"
          description: Common ancestor state.
        changed_in_a:
          type: array
          items: { type: string }
        changed_in_b:
          type: array
          items: { type: string }

    CapabilityRequestRequest:
      type: object
      required: [principal, operation]
      properties:
        principal: { type: string, pattern: "^pr-" }
        operation: { type: string }
        params:
          description: Operation parameters evaluated against policy.
        branch:
          type: string
          pattern: "^br-"
          description: Bind the lease to this branch.

    CapabilityDelegateRequest:
      type: object
      required: [delegator, parent_lease, delegatee, uses, expires_at]
      properties:
        delegator: { type: string, pattern: "^pr-" }
        parent_lease: { type: string, pattern: "^lease-" }
        delegatee: { type: string, pattern: "^pr-" }
        constraints:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Constraint" }
        uses: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    CompileEnvelopeRequest:
      type: object
      required: [principal, requests]
      properties:
        principal: { type: string, pattern: "^pr-" }
        branch:
          type: string
          pattern: "^br-"
          description: Bind every minted lease to this branch.
        requests:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/EnvelopeRequest" }

    EnvelopeRequest:
      type: object
      required: [operation]
      properties:
        operation: { type: string }
        params:
          description: Constraint parameters evaluated against policy.

    EnvelopeItemReport:
      type: object
      required: [operation]
      description: Exactly one of `lease` / `denial` is present.
      properties:
        operation: { type: string }
        lease: { $ref: "#/components/schemas/CapabilityLease" }
        denial: { $ref: "#/components/schemas/Denial" }

    EnvelopeReport:
      type: object
      required: [items, granted, needs_human, refused]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnvelopeItemReport" }
        granted: { type: integer, minimum: 0 }
        needs_human:
          type: integer
          minimum: 0
          description: Denied items whose requestable scopes name a human escalation.
        refused: { type: integer, minimum: 0 }

    ReplayRequest:
      type: object
      description: Mode-specific fields; see replay.run.
      properties:
        seq_from:
          type: integer
          description: audit — inclusive ledger sequence range start.
        seq_to:
          type: integer
          description: audit — inclusive ledger sequence range end.
        step:
          type: string
          pattern: "^step-"
          description: sandbox — the recorded step to re-execute.
        effect:
          type: string
          pattern: "^fx-"
          description: live — the recorded effect whose contract is re-committed.
        approver:
          type: string
          pattern: "^pr-"
          description: live — principal approving the new commit.

    ReplayAuditResponse:
      type: object
      required: [mode, events]
      properties:
        mode: { const: audit }
        events:
          type: array
          items: { $ref: "#/components/schemas/LedgerEvent" }

    ReplaySandboxReport:
      type: object
      required: [step, rerun_exit_code, workspace_match, replay_class]
      properties:
        step: { type: string, pattern: "^step-" }
        original_exit_code: { type: [integer, "null"] }
        rerun_exit_code: { type: integer }
        workspace_match:
          type: boolean
          description: >
            Whether the re-executed workspace tree hashed identically to
            the recorded post-step state.
        replay_class: { $ref: "#/components/schemas/ReplayClass" }

    LedgerEvent:
      type: object
      description: One event of the causal ledger (ak-causal-ledger).
      required: [seq, kind]
      properties:
        seq: { type: integer }
        kind: { type: string }
      additionalProperties: true
