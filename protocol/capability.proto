// AgentKernel Execution Protocol — capabilities, leases, denials, budgets.
//
// Wire-compatible with the canonical JSON encoding in ak-core
// (kernel/core/src/{capability,denial,budget,principal}.rs). JSON field names
// are snake_case; enums map to ak-core serde renames as documented per enum.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Budgets
// ---------------------------------------------------------------------------

// Unified resource accounting (ak-core ResourceBudget).
message ResourceBudget {
  uint64 cpu_ms = 1;
  uint64 memory_bytes = 2;
  uint64 network_bytes = 3;
  uint64 tokens = 4;
  uint64 cost_micro_usd = 5;
  uint32 risk_units = 6;
}

// ---------------------------------------------------------------------------
// Principals
// ---------------------------------------------------------------------------

// JSON: snake_case strings ("agent", "sub_agent", ...).
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_AGENT = 1;
  PRINCIPAL_KIND_SUB_AGENT = 2;
  PRINCIPAL_KIND_TOOL = 3;
  PRINCIPAL_KIND_HUMAN = 4;
  PRINCIPAL_KIND_KERNEL = 5;
}

// JSON: snake_case strings ("quarantined", ...). Ordered by increasing trust.
enum TrustLevel {
  TRUST_LEVEL_UNSPECIFIED = 0;
  TRUST_LEVEL_QUARANTINED = 1;
  TRUST_LEVEL_UNTRUSTED = 2;
  TRUST_LEVEL_LIMITED = 3;
  TRUST_LEVEL_STANDARD = 4;
  TRUST_LEVEL_ELEVATED = 5;
}

message Principal {
  string id = 1; // "pr-..."
  PrincipalKind kind = 2;
  string display_name = 3;
  optional string parent = 4; // "pr-..."
  TrustLevel trust = 5;
}

// ---------------------------------------------------------------------------
// Constraints
// ---------------------------------------------------------------------------

// A deterministic constraint on one operation parameter.
// JSON: internally tagged with "kind" ("equals" | "one_of" | "glob" |
// "prefix" | "max" | "forbidden") per ak-core Constraint.
message Constraint {
  oneof kind {
    ConstraintEquals equals = 1;
    ConstraintOneOf one_of = 2;
    ConstraintGlob glob = 3;
    ConstraintPrefix prefix = 4;
    ConstraintMax max = 5;
    ConstraintForbidden forbidden = 6;
  }
}
