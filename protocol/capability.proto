// AgentKernel Execution Protocol — capabilities, leases, denials, budgets.
//
// Wire-compatible with the canonical JSON encoding in ak-core
// (kernel/core/src/{capability,denial,budget,principal}.rs). JSON field names
// are snake_case; enums map to ak-core serde renames as documented per enum.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Budgets
// ---------------------------------------------------------------------------

// Unified resource accounting (ak-core ResourceBudget).
message ResourceBudget {
  uint64 cpu_ms = 1;
  uint64 memory_bytes = 2;
  uint64 network_bytes = 3;
  uint64 tokens = 4;
  uint64 cost_micro_usd = 5;
  uint32 risk_units = 6;
}

// ---------------------------------------------------------------------------
// Principals
// ---------------------------------------------------------------------------

// JSON: snake_case strings ("agent", "sub_agent", ...).
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_AGENT = 1;
  PRINCIPAL_KIND_SUB_AGENT = 2;
  PRINCIPAL_KIND_TOOL = 3;
  PRINCIPAL_KIND_HUMAN = 4;
  PRINCIPAL_KIND_KERNEL = 5;
}

// JSON: snake_case strings ("quarantined", ...). Ordered by increasing trust.
enum TrustLevel {
  TRUST_LEVEL_UNSPECIFIED = 0;
  TRUST_LEVEL_QUARANTINED = 1;
  TRUST_LEVEL_UNTRUSTED = 2;
  TRUST_LEVEL_LIMITED = 3;
  TRUST_LEVEL_STANDARD = 4;
  TRUST_LEVEL_ELEVATED = 5;
}

message Principal {
  string id = 1; // "pr-..."
  PrincipalKind kind = 2;
  string display_name = 3;
  optional string parent = 4; // "pr-..."
  TrustLevel trust = 5;
}

// ---------------------------------------------------------------------------
// Constraints
// ---------------------------------------------------------------------------

// A deterministic constraint on one operation parameter.
// JSON: internally tagged with "kind" ("equals" | "one_of" | "glob" |
// "prefix" | "max" | "forbidden") per ak-core Constraint.
message Constraint {
  oneof kind {
    ConstraintEquals equals = 1;
    ConstraintOneOf one_of = 2;
    ConstraintGlob glob = 3;
    ConstraintPrefix prefix = 4;
    ConstraintMax max = 5;
    ConstraintForbidden forbidden = 6;
  }
}

message ConstraintEquals {
  google.protobuf.Value value = 1;
}
message ConstraintOneOf {
  repeated google.protobuf.Value values = 1;
}
message ConstraintGlob {
  string pattern = 1; // `*`-only glob
}
message ConstraintPrefix {
  string prefix = 1;
}
message ConstraintMax {
  double max = 1;
}
message ConstraintForbidden {}

// ---------------------------------------------------------------------------
// Leases
// ---------------------------------------------------------------------------

// A grant of bounded authority to one principal (ak-core CapabilityLease).
// Operations are namespaced strings, e.g. "fs.write",
// "github.create_pull_request".
message CapabilityLease {
  string id = 1; // "lease-..."
  string principal = 2; // "pr-..."
  string operation = 3;
  // Constraints keyed by canonical parameter name (insertion-ordered in the
  // JSON binding).
  map<string, Constraint> constraints = 4;
  uint32 remaining_uses = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // Branch this lease is bound to, if any. Authority does not follow the
  // agent across branches unless explicitly rebound.
  optional string bound_branch = 8; // "br-..."
  ResourceBudget budget = 9;
  // Lease this one was attenuated from, for the audit chain.
  optional string parent_lease = 10; // "lease-..."
  // Deterministic preconditions revalidated at commit time.
  google.protobuf.Struct preconditions = 11;
  bool revoked = 12;
}

// ---------------------------------------------------------------------------
// Denials
// ---------------------------------------------------------------------------

// JSON: SCREAMING_SNAKE_CASE strings, e.g. "CAPABILITY_DENIED".
enum DenialCode {
  DENIAL_CODE_UNSPECIFIED = 0;
  CAPABILITY_DENIED = 1;
  CAPABILITY_EXPIRED = 2;
  CAPABILITY_EXHAUSTED = 3;
  BUDGET_EXHAUSTED = 4;
  CONSTRAINT_VIOLATED = 5;
  BRANCH_MISMATCH = 6;
  EFFECT_REQUIRES_APPROVAL = 7;
  STALE_AUTHORIZATION = 8;
  PRECONDITION_FAILED = 9;
  DUPLICATE_COMMIT = 10;
  BACKEND_UNAVAILABLE = 11;
  POLICY_FORBIDDEN = 12;
}

// A scope the agent may request to unblock itself.
message RequestableScope {
  string operation = 1;
  // Constraint sketch the policy would consider.
  google.protobuf.Value constraints = 2;
  bool requires_human = 3;
}

// The structured denial returned instead of a bare "Permission denied".
// Invariant: no denial without a machine-readable explanation.
message Denial {
  DenialCode code = 1;
  string attempted_operation = 2;
  string reason = 3;
  repeated string safe_alternatives = 4;
  repeated RequestableScope requestable_scopes = 5;
  bool escalation_allowed = 6;
}

// Wire-serializable error envelope (ak-core ErrorEnvelope).
message ErrorEnvelope {
  string code = 1; // e.g. "DENIED", "NOT_FOUND", "STALE_AUTHORIZATION"
  string message = 2;
  optional Denial denial = 3;
}

// ---------------------------------------------------------------------------
// Capability service
// ---------------------------------------------------------------------------

message CapabilityDescribeRequest {
  string principal = 1; // "pr-..."
  // If set, only leases for this operation namespace.
  optional string namespace = 2;
}

message CapabilityDescribeResponse {
  repeated CapabilityLease leases = 1;
}

message CapabilityRequestRequest {
  string principal = 1;
  string operation = 2;
  map<string, Constraint> constraints = 3;
  uint32 uses = 4;
  google.protobuf.Timestamp expires_at = 5;
  ResourceBudget budget = 6;
  optional string bound_branch = 7;
  // Free-text justification for policy / human review. Audit-only input.
  string justification = 8;
}
