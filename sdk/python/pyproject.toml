[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkernel"
version = "0.6.0"
description = "Typed Python client for the AgentKernel Execution Protocol HTTP API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentKernel contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentkernel"]
