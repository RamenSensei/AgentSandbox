name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap (verified OS sandbox for shell steps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces by default,
          # which bwrap needs; relax it for the test run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Test
        run: cargo test --workspace
      - name: Prepare delegated cgroup v2 parent
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          for controller in cpu memory pids; do
            grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers
            if ! grep -qw "$controller" /sys/fs/cgroup/cgroup.subtree_control; then
              sudo sh -c "echo +$controller > /sys/fs/cgroup/cgroup.subtree_control"
            fi
          done
          sudo mkdir /sys/fs/cgroup/agent-kernel-ci
          sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/agent-kernel-ci/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/agent-kernel-ci/runner
          sudo chown "$(id -u):$(id -g)" \
            /sys/fs/cgroup/agent-kernel-ci \
            /sys/fs/cgroup/agent-kernel-ci/cgroup.procs \
            /sys/fs/cgroup/agent-kernel-ci/cgroup.threads \
            /sys/fs/cgroup/agent-kernel-ci/cgroup.subtree_control
      - name: Linux cgroup and netns enforcement E2E
        env:
          AK_CGROUP_PARENT: /sys/fs/cgroup/agent-kernel-ci
          AK_REQUIRE_CGROUP: "1"
          AK_REQUIRE_NETNS_EGRESS: "1"
        run: |
          set -euo pipefail
          sudo env \
            AK_CGROUP_PARENT="$AK_CGROUP_PARENT" \
            AK_REQUIRE_CGROUP="$AK_REQUIRE_CGROUP" \
            AK_REQUIRE_NETNS_EGRESS="$AK_REQUIRE_NETNS_EGRESS" \
            TEST_UID="$(id -u)" \
            TEST_GID="$(id -g)" \
            HOME="$HOME" \
            PATH="$PATH" \
            bash -c '
              echo $$ > "$AK_CGROUP_PARENT/runner/cgroup.procs"
              exec setpriv --reuid="$TEST_UID" --regid="$TEST_GID" --clear-groups \
                env HOME="$HOME" PATH="$PATH" \
                  AK_CGROUP_PARENT="$AK_CGROUP_PARENT" \
                  AK_REQUIRE_CGROUP="$AK_REQUIRE_CGROUP" \
                  AK_REQUIRE_NETNS_EGRESS="$AK_REQUIRE_NETNS_EGRESS" \
                  /bin/bash -c "
                    cargo test -p ak-backend-local --test cgroup_enforce --test egress_sandbox -- --nocapture
                    cargo test -p ak-backend-local cgroup::tests::lifecycle_on_delegated_hosts -- --nocapture
                  "
            '
      - name: Remove delegated cgroup v2 parent
        if: always()
        run: |
          if test -d /sys/fs/cgroup/agent-kernel-ci; then
            sudo rmdir /sys/fs/cgroup/agent-kernel-ci/runner
            sudo rmdir /sys/fs/cgroup/agent-kernel-ci
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-protoc@v3
      - name: Validate protos
        run: protoc --descriptor_set_out=/dev/null -I . protocol/*.proto
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate OpenAPI
        run: |
          pip install pyyaml openapi-spec-validator
          python -m openapi_spec_validator protocol/openapi.yaml

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install pytest
          python -m pytest sdk/python -W error::ResourceWarning

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Typecheck and test
        working-directory: sdk/typescript
        run: |
          npm ci
          npx tsc --noEmit
          npm test --if-present

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static assets referenced by index.html exist
        run: |
          cd ui
          for asset in style.css app.js demo-data.json; do
            test -f "$asset" || { echo "missing $asset"; exit 1; }
          done
          for ref in style.css app.js; do
            grep -q "$ref" index.html || { echo "index.html does not reference $ref"; exit 1; }
          done
