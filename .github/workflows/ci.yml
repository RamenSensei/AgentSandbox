name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap (verified OS sandbox for shell steps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces by default,
          # which bwrap needs; relax it for the test run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Test
        run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
      - name: Validate protos
        run: protoc --descriptor_set_out=/dev/null -I . protocol/*.proto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAPI
        run: |
          pip install pyyaml openapi-spec-validator
          python -m openapi_spec_validator protocol/openapi.yaml

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install pytest
          python -m pytest sdk/python -W error::ResourceWarning

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck and test
        working-directory: sdk/typescript
        run: |
          npm ci
          npx tsc --noEmit
          npm test --if-present

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static assets referenced by index.html exist
        run: |
          cd ui
          for asset in style.css app.js demo-data.json; do
            test -f "$asset" || { echo "missing $asset"; exit 1; }
          done
          for ref in style.css app.js; do
            grep -q "$ref" index.html || { echo "index.html does not reference $ref"; exit 1; }
          done
