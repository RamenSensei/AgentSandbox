// AgentKernel Execution Protocol — the causal ledger and replay.
//
// Mirrors ak-core kernel/core/src/{state,replay,observation}.rs.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protocol/capability.proto";
import "protocol/effect.proto";

// ---------------------------------------------------------------------------
// Replay classes and modes
// ---------------------------------------------------------------------------

// What a backend can faithfully capture and replay.
// JSON: snake_case strings ("audit_only", ...). Ordered by capability.
enum ReplayClass {
  REPLAY_CLASS_UNSPECIFIED = 0;
  // Only the recorded observations can be played back; no re-execution.
  REPLAY_CLASS_AUDIT_ONLY = 1;
  // Workspace files are content-addressed and restorable.
  REPLAY_CLASS_FILESYSTEM_ONLY = 2;
  // Filesystem plus process tree checkpoint/restore.
  REPLAY_CLASS_PROCESS_AND_FILESYSTEM = 3;
  // Framework-level host calls recorded, replayable byte-identically under
  // pinned time/randomness.
  REPLAY_CLASS_FRAMEWORK_HOST_CALLS = 4;
  // Browser profile and page state are restorable.
  REPLAY_CLASS_BROWSER_PROFILE = 5;
}

// The three replay modes exposed by the protocol.
// JSON: "audit" | "sandbox" | "live".
enum ReplayMode {
  REPLAY_MODE_UNSPECIFIED = 0;
  // Play back recorded model responses, tool results and receipts.
  // Never re-executes anything.
  REPLAY_MODE_AUDIT = 1;
  // Restore internal state and re-execute local code with recorded inputs
  // substituted where captured.
  REPLAY_MODE_SANDBOX = 2;
  // Reconnect to the live external world and re-execute the same effect
  // contracts. Guarantees the *contract*, not the outcome.
  REPLAY_MODE_LIVE = 3;
}

// ---------------------------------------------------------------------------
// State DAG
// ---------------------------------------------------------------------------

// One file-level change in the workspace adapter.
// JSON: internally tagged with "op" ("added" | "modified" | "deleted").
message FileChange {
  oneof op {
    FileChangeAdded added = 1;
    FileChangeModified modified = 2;
    FileChangeDeleted deleted = 3;
  }
}

message FileChangeAdded {
  string path = 1;
  string blob = 2; // "sha256:..."
  uint32 mode = 3;
}
message FileChangeModified {
  string path = 1;
  string old_blob = 2;
  string new_blob = 3;
}
message FileChangeDeleted {
  string path = 1;
  string old_blob = 2;
}

// The immutable delta produced by one step, spanning all adapters.
message StateDelta {
  repeated FileChange files = 1;
  repeated string processes_started = 2;
  repeated string processes_exited = 3;
  repeated string tool_sessions = 4;
  uint64 policy_epoch = 5;
  repeated string effects_proposed = 6; // "fx-..."
  repeated string effects_committed = 7; // "rcpt-..."
}

// An immutable node in the world-state DAG.
message StateNode {
  string id = 1; // "st-..."
  string episode = 2; // "ep-..."
  string branch = 3; // "br-..."
  optional string parent = 4; // "st-..."; absent only for the episode root
  optional string produced_by = 5; // "step-..."; absent for roots and merges
  optional string merge_parent = 6; // "st-..." for merge nodes
  string actor = 7; // "pr-..."
  StateDelta delta = 8;
  // Merkle root of the workspace tree at this node.
  string workspace_root = 9; // "sha256:..."
  ReplayClass replay_class = 10;
  google.protobuf.Timestamp created_at = 11;
}

// ---------------------------------------------------------------------------
// Trace entries
// ---------------------------------------------------------------------------

// One entry of the causal ledger: an action, its authorization, its
// observation, and the state node it produced.
message TraceEntry {
  string step = 1; // "step-..."
  string episode = 2; // "ep-..."
  string branch = 3; // "br-..."
  string actor = 4; // "pr-..."
  // The action as canonical JSON (ActionKind, tagged with "kind").
  google.protobuf.Struct action = 5;
  string lease = 6; // "lease-..."
  // The observation as canonical JSON (Observation, tagged with "kind").
  google.protobuf.Struct observation = 7;
  optional string produced_state = 8; // "st-..."
  ResourceBudget usage = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message TraceQueryRequest {
  // Query in the trace query language, e.g.
  // `effects where class >= compensatable and branch = "br-42"`.
  string query = 1;
  optional string episode = 2; // scope: "ep-..."
  uint32 limit = 3;
  string page_token = 4;
}

message TraceQueryResponse {
  repeated TraceEntry entries = 1;
  string next_page_token = 2;
}

// trace.query
service TraceService {
  rpc Query(TraceQueryRequest) returns (TraceQueryResponse);
}

// ---------------------------------------------------------------------------
// Replay service
// ---------------------------------------------------------------------------

message ReplayRequest {
  string episode = 1; // "ep-..."
  // Replay only this contiguous step range (empty = whole episode).
  optional string from_step = 2;
  optional string to_step = 3;
}

// One divergence between the recorded run and the replayed run.
message ReplayDivergence {
  string step = 1;
  // "observation" | "state" | "effect_contract" | "effect_outcome"
  string layer = 2;
  string recorded_digest = 3;
  string replayed_digest = 4;
  string detail = 5;
}

message ReplayReport {
  string episode = 1;
  ReplayMode mode = 2;
  // The weakest replay class among the replayed steps: the honest ceiling
  // of what this report can claim.
  ReplayClass effective_class = 3;
  uint32 steps_replayed = 4;
  repeated ReplayDivergence divergences = 5;
  // For live replay: receipts of re-executed effect contracts.
  repeated Receipt receipts = 6;
  google.protobuf.Timestamp completed_at = 7;
}
