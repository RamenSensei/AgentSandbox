[workspace]
resolver = "2"
members = [
    "kernel/core",
    "kernel/identity",
    "kernel/policy",
    "kernel/state_dag",
    "kernel/effect_broker",
    "kernel/causal_ledger",
    "kernel/scheduler",
    "backends/local",
    "backends/cube",
    "backends/forkd",
    "backends/gvisor",
    "backends/kubernetes",
    "connectors/github",
    "connectors/http",
    "connectors/mcp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/agent-kernel/agent-kernel"
rust-version = "1.80"

[workspace.dependencies]
ak-core = { path = "kernel/core" }
ak-identity = { path = "kernel/identity" }
ak-policy = { path = "kernel/policy" }
ak-state-dag = { path = "kernel/state_dag" }
ak-effect-broker = { path = "kernel/effect_broker" }
ak-causal-ledger = { path = "kernel/causal_ledger" }
ak-scheduler = { path = "kernel/scheduler" }
ak-backend-local = { path = "backends/local" }
ak-backend-cube = { path = "backends/cube" }
ak-backend-forkd = { path = "backends/forkd" }
ak-backend-gvisor = { path = "backends/gvisor" }
ak-backend-kubernetes = { path = "backends/kubernetes" }
ak-connector-github = { path = "connectors/github" }
ak-connector-http = { path = "connectors/http" }
ak-connector-mcp = { path = "connectors/mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = "0.7"
tower = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
