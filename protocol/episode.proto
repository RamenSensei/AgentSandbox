// AgentKernel Execution Protocol — episodes, steps and branches.
//
// Mirrors ak-core kernel/core/src/{action,observation}.rs plus the episode /
// branch surface of the kernel API server.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protocol/capability.proto";
import "protocol/effect.proto";
import "protocol/trace.proto";

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

// The action taxonomy. Every variant is a *semantic* request; the kernel —
// not the agent — decides which isolation backend executes it.
// JSON: internally tagged with "kind" ("shell" | "read_file" | "write_file" |
// "delete_path" | "http_read" | "mcp_invoke" | "connector_op" |
// "trace_query" | "branch_diff").
message ActionKind {
  oneof kind {
    ActionShell shell = 1;
    ActionReadFile read_file = 2;
    ActionWriteFile write_file = 3;
    ActionDeletePath delete_path = 4;
    ActionHttpRead http_read = 5;
    ActionMcpInvoke mcp_invoke = 6;
    ActionConnectorOp connector_op = 7;
    ActionTraceQuery trace_query = 8;
    ActionBranchDiff branch_diff = 9;
  }
}

message ActionShell {
  string command = 1;
  optional string cwd = 2;
  map<string, string> env = 3;
}
message ActionReadFile {
  string path = 1;
}
message ActionWriteFile {
  string path = 1;
  string contents_b64 = 2;
}
message ActionDeletePath {
  string path = 1;
}
message ActionHttpRead {
  string url = 1;
}
message ActionMcpInvoke {
  string server = 1;
  string tool = 2;
  google.protobuf.Value arguments = 3;
}
// Never executed inline: the kernel turns it into a proposed effect.
message ActionConnectorOp {
  string connector = 1;
  string operation = 2;
  google.protobuf.Value params = 3;
}
message ActionTraceQuery {
  string query = 1;
}
message ActionBranchDiff {
  string since = 1; // "st-..."
}

// A fully-specified execution request from a principal.
message Action {
  ActionKind kind = 1;
  // Lease presented as authority for this action. No ambient authority.
  string lease = 2; // "lease-..."
  // Used ONLY for scheduling and audit narration — never for authorization.
  optional string intent_hint = 3;
  ResourceBudget budget = 4;
}
