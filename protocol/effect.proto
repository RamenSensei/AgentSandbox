// AgentKernel Execution Protocol — external effects.
//
// Anything that leaves the sandbox goes through:
// propose -> canonicalize -> prepare -> authorize -> commit-time
// revalidation -> commit -> signed receipt.
// Mirrors ak-core kernel/core/src/effect.rs.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protocol/capability.proto";

// Honest classification of an effect's reversibility.
// JSON: snake_case strings ("pure", ..., "opaque_external").
// Ordered by increasing severity.
enum EffectClass {
  EFFECT_CLASS_UNSPECIFIED = 0;
  // No observable side effect.
  EFFECT_CLASS_PURE = 1;
  // Reversible by rolling back local state.
  EFFECT_CLASS_LOCAL_REVERSIBLE = 2;
  // The remote system offers a true undo.
  EFFECT_CLASS_REMOTE_REVERSIBLE = 3;
  // Reversible only via a compensating action (e.g. close the PR).
  EFFECT_CLASS_COMPENSATABLE = 4;
  // Cannot be undone (e.g. an email that has been read).
  EFFECT_CLASS_IRREVERSIBLE = 5;
  // Semantics unknown; treated as irreversible and maximally restricted.
  EFFECT_CLASS_OPAQUE_EXTERNAL = 6;
}

// The canonical, immutable description of what will be done to the world.
// The hash of this structure is what humans approve; approving an effect
// means approving *exactly* this.
message EffectContract {
  string operation = 1; // e.g. "github.create_pull_request"
  string resource = 2; // e.g. "org/repo"
  google.protobuf.Struct arguments = 3;
  // Deterministic preconditions on the external world, revalidated at commit.
  google.protobuf.Struct preconditions = 4;
  // Exactly-once key: "episode-<n>-step-<m>" by convention.
  string idempotency_key = 5;
  EffectClass class = 6;
}

// Lifecycle of a pending effect.
// JSON: internally tagged with "phase" ("proposed" | "prepared" | "approved" |
// "committed" | "aborted" | "compensated").
message EffectPhase {
  oneof phase {
    EffectPhaseProposed proposed = 1;
    EffectPhasePrepared prepared = 2;
    EffectPhaseApproved approved = 3;
    EffectPhaseCommitted committed = 4;
    EffectPhaseAborted aborted = 5;
    EffectPhaseCompensated compensated = 6;
  }
}

message EffectPhaseProposed {}
message EffectPhasePrepared {
  google.protobuf.Value preview = 1;
}
message EffectPhaseApproved {
  string approver = 1; // "pr-..."
  google.protobuf.Timestamp approved_at = 2;
  uint64 policy_epoch = 3;
}
message EffectPhaseCommitted {
  string receipt = 1; // "rcpt-..."
}
message EffectPhaseAborted {
  string reason = 1;
}
message EffectPhaseCompensated {
  string compensating_receipt = 1; // "rcpt-..."
}

// A pending (not yet committed) external effect.
message PendingEffect {
  string id = 1; // "fx-..."
  EffectContract contract = 2;
  string contract_hash = 3; // "sha256:..."
  string proposer = 4; // "pr-..."
  string branch = 5; // "br-..."
  string step = 6; // "step-..."
  string lease = 7; // "lease-..."
  EffectPhase phase = 8;
  google.protobuf.Timestamp proposed_at = 9;
}
