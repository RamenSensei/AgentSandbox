// AgentKernel Execution Protocol — external effects.
//
// Anything that leaves the sandbox goes through:
// propose -> canonicalize -> prepare -> authorize -> commit-time
// revalidation -> commit -> signed receipt.
// Mirrors ak-core kernel/core/src/effect.rs.
syntax = "proto3";

package agentkernel.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protocol/capability.proto";

// Honest classification of an effect's reversibility.
// JSON: snake_case strings ("pure", ..., "opaque_external").
// Ordered by increasing severity.
enum EffectClass {
  EFFECT_CLASS_UNSPECIFIED = 0;
  // No observable side effect.
  EFFECT_CLASS_PURE = 1;
  // Reversible by rolling back local state.
  EFFECT_CLASS_LOCAL_REVERSIBLE = 2;
  // The remote system offers a true undo.
  EFFECT_CLASS_REMOTE_REVERSIBLE = 3;
  // Reversible only via a compensating action (e.g. close the PR).
  EFFECT_CLASS_COMPENSATABLE = 4;
  // Cannot be undone (e.g. an email that has been read).
  EFFECT_CLASS_IRREVERSIBLE = 5;
  // Semantics unknown; treated as irreversible and maximally restricted.
  EFFECT_CLASS_OPAQUE_EXTERNAL = 6;
}

// The canonical, immutable description of what will be done to the world.
// The hash of this structure is what humans approve; approving an effect
// means approving *exactly* this.
message EffectContract {
  string operation = 1; // e.g. "github.create_pull_request"
  string resource = 2; // e.g. "org/repo"
  google.protobuf.Struct arguments = 3;
  // Deterministic preconditions on the external world, revalidated at commit.
  google.protobuf.Struct preconditions = 4;
  // Exactly-once key: "episode-<n>-step-<m>" by convention.
  string idempotency_key = 5;
  EffectClass class = 6;
}

// Lifecycle of a pending effect.
// JSON: internally tagged with "phase" ("proposed" | "prepared" | "approved" |
// "committed" | "aborted" | "compensated").
message EffectPhase {
  oneof phase {
    EffectPhaseProposed proposed = 1;
    EffectPhasePrepared prepared = 2;
    EffectPhaseApproved approved = 3;
    EffectPhaseCommitted committed = 4;
    EffectPhaseAborted aborted = 5;
    EffectPhaseCompensated compensated = 6;
  }
}

message EffectPhaseProposed {}
message EffectPhasePrepared {
  google.protobuf.Value preview = 1;
}
message EffectPhaseApproved {
  string approver = 1; // "pr-..."
  google.protobuf.Timestamp approved_at = 2;
  uint64 policy_epoch = 3;
}
message EffectPhaseCommitted {
  string receipt = 1; // "rcpt-..."
}
message EffectPhaseAborted {
  string reason = 1;
}
message EffectPhaseCompensated {
  string compensating_receipt = 1; // "rcpt-..."
}

// A pending (not yet committed) external effect.
message PendingEffect {
  string id = 1; // "fx-..."
  EffectContract contract = 2;
  string contract_hash = 3; // "sha256:..."
  string proposer = 4; // "pr-..."
  string branch = 5; // "br-..."
  string step = 6; // "step-..."
  string lease = 7; // "lease-..."
  EffectPhase phase = 8;
  google.protobuf.Timestamp proposed_at = 9;
}

message ReceiptBody {
  string effect = 1; // "fx-..."
  string who = 2; // "pr-..."
  string operation = 3;
  string resource = 4;
  string contract_hash = 5;
  string branch = 6;
  string step = 7;
  uint64 policy_epoch = 8;
  // Hash of the approval decision (who approved what, when).
  string authorization_witness = 9;
  // Digest of the external system's response.
  string external_response_digest = 10;
  google.protobuf.Timestamp committed_at = 11;
}

// A non-repudiable record of a committed effect. The signature covers
// canonical_json(body).
message Receipt {
  string id = 1; // "rcpt-..."
  ReceiptBody body = 2;
  // Ed25519 signature over canonical JSON of body, hex-encoded.
  string signature = 3;
  string key_id = 4;
}

// ---------------------------------------------------------------------------
// Effect service
// ---------------------------------------------------------------------------

message EffectProposeRequest {
  EffectContract contract = 1;
  string proposer = 2; // "pr-..."
  string branch = 3; // "br-..."
  string step = 4; // "step-..."
  string lease = 5; // "lease-..."
}

message EffectProposeResponse {
  oneof outcome {
    PendingEffect effect = 1;
    Denial denial = 2;
  }
}

message EffectPrepareRequest {
  string effect = 1; // "fx-..."
}

message EffectPrepareResponse {
  // Human/agent-reviewable preview of exactly what will happen.
  google.protobuf.Value preview = 1;
  // Current values of the contract's preconditions, observed now.
  google.protobuf.Value observed_preconditions = 2;
  PendingEffect effect = 3;
}

message EffectCommitRequest {
  string effect = 1; // "fx-..."
  // The contract hash the caller believes it is committing. Commit fails
  // with STALE_AUTHORIZATION when this does not match the stored contract.
  string expected_contract_hash = 2;
}

message EffectCommitResponse {
  oneof outcome {
    Receipt receipt = 1;
    Denial denial = 2;
  }
}

message EffectCompensateRequest {
  string effect = 1; // "fx-..." (must be committed)
  string reason = 2;
}

message EffectCompensateResponse {
  Receipt compensating_receipt = 1;
}

// effect.propose / effect.prepare / effect.commit / effect.compensate
service EffectService {
  rpc Propose(EffectProposeRequest) returns (EffectProposeResponse);
  // Dry-run against the live external system. Never causes a side effect.
  rpc Prepare(EffectPrepareRequest) returns (EffectPrepareResponse);
  // Runs commit-time revalidation of lease, preconditions and contract hash
  // before touching the world. Duplicate idempotency keys return the
  // original receipt.
  rpc Commit(EffectCommitRequest) returns (EffectCommitResponse);
  rpc Compensate(EffectCompensateRequest) returns (EffectCompensateResponse);
}
