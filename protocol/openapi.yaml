openapi: 3.1.0
info:
  title: AgentKernel Execution Protocol — HTTP/JSON binding
  version: 1.0.0
  description: |
    JSON/HTTP binding of the AgentKernel Execution Protocol exposed by the
    kernel API server. Wire objects use the canonical JSON encoding of
    ak-core (snake_case fields, internally tagged enums, prefixed string
    ids: ep-/step-/br-/st-/pr-/lease-/fx-/rcpt-).

    Errors are returned as an ErrorEnvelope `{code, message, denial?}`.
    Policy denials are HTTP 403 with `code: "DENIED"` and the full
    structured Denial — never a bare "permission denied".
servers:
  - url: /
tags:
  - name: episodes
  - name: steps
  - name: branches
  - name: capabilities
  - name: effects
  - name: trace
  - name: replay
  - name: receipts

paths:
  /v1/episodes:
    post:
      tags: [episodes]
      operationId: episode.create
      summary: Create an episode with its root state and main branch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeCreateRequest" }
      responses:
        "201":
          description: Episode created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeCreateResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/episodes/{id}:
    get:
      tags: [episodes]
      operationId: episode.describe
      summary: Describe an episode, its branches and remaining budget.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Episode description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeDescribeResponse" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/execute:
    post:
      tags: [steps]
      operationId: step.execute
      summary: Execute one action on a branch as a principal.
      description: |
        Every action must present a lease (no ambient authority). A policy
        rejection is returned as HTTP 200 with an Observation of kind
        "denied" when the step itself was recorded, or HTTP 403 with an
        ErrorEnvelope when the request could not be admitted at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepExecuteRequest" }
      responses:
        "200":
          description: The step ran (possibly to a denial observation).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepExecuteResponse" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/{id}/explain:
    get:
      tags: [steps]
      operationId: step.explain
      summary: Full authorization narrative for a recorded step.
      parameters:
        - $ref: "#/components/parameters/StepId"
      responses:
        "200":
          description: Explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepExplainResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/steps/{id}/retry:
    post:
      tags: [steps]
      operationId: step.retry
      summary: Re-execute a recorded step, optionally on another branch.
      parameters:
        - $ref: "#/components/parameters/StepId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepRetryRequest" }
      responses:
        "200":
          description: Retry result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepExecuteResponse" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/fork:
    post:
      tags: [branches]
      operationId: branch.fork
      summary: Fork one or more sibling branches (parallel speculation).
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchForkRequest" }
      responses:
        "200":
          description: Forked branches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchForkResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/diff:
    post:
      tags: [branches]
      operationId: branch.diff
      summary: Semantic diff of a branch since a state (default fork point).
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchDiffRequest" }
      responses:
        "200":
          description: Diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDiffResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/compare/{other}:
    get:
      tags: [branches]
      operationId: branch.compare
      summary: Compare two branches since their common ancestor.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: other
          in: path
          required: true
          schema: { type: string, pattern: "^br-" }
      responses:
        "200":
          description: Comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchCompareResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/merge:
    post:
      tags: [branches]
      operationId: branch.merge
      summary: Merge this branch into a destination branch.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchMergeRequest" }
      responses:
        "200":
          description: Merge result (merged state node or conflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchMergeResponse" }
        "409":
          description: Merge conflict (code MERGE_CONFLICT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /v1/branches/{id}/discard:
    post:
      tags: [branches]
      operationId: branch.discard
      summary: Discard a speculative branch and its backend resources.
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchDiscardRequest" }
      responses:
        "200":
          description: Discarded branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/request:
    post:
      tags: [capabilities]
      operationId: capability.request
      summary: Request a new capability lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityRequestRequest" }
      responses:
        "200":
          description: Lease granted or queued for human approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityRequestResponse" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/delegate:
    post:
      tags: [capabilities]
      operationId: capability.delegate
      summary: Attenuate a lease for a child principal. Never widens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityDelegateRequest" }
      responses:
        "200":
          description: Child lease.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityLease" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/revoke:
    post:
      tags: [capabilities]
      operationId: capability.revoke
      summary: Revoke a lease (optionally its whole delegation subtree).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityRevokeRequest" }
      responses:
        "200":
          description: Revoked lease ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityRevokeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/capabilities/{principal}:
    get:
      tags: [capabilities]
      operationId: capability.describe
      summary: List the leases currently held by a principal.
      parameters:
        - name: principal
          in: path
          required: true
          schema: { type: string, pattern: "^pr-" }
        - name: namespace
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityDescribeResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects:
    post:
      tags: [effects]
      operationId: effect.propose
      summary: Propose an external effect (canonicalized on ingest).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectProposeRequest" }
      responses:
        "201":
          description: Pending effect (or a denial in the body union).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectProposeResponse" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}:
    get:
      tags: [effects]
      operationId: effect.get
      summary: Fetch a pending or resolved effect.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: The effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEffect" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/prepare:
    post:
      tags: [effects]
      operationId: effect.prepare
      summary: Dry-run the effect against the live world. No side effects.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      responses:
        "200":
          description: Preview and observed preconditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectPrepareResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/approve:
    post:
      tags: [effects]
      operationId: effect.approve
      summary: Record an approval of exactly this contract hash.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectApproveRequest" }
      responses:
        "200":
          description: The effect, now in phase "approved".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEffect" }
        "403": { $ref: "#/components/responses/Denied" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/commit:
    post:
      tags: [effects]
      operationId: effect.commit
      summary: Commit the effect after commit-time revalidation.
      description: |
        Revalidates lease, preconditions, policy epoch and contract hash
        before touching the world. A mismatched expected_contract_hash fails
        with STALE_AUTHORIZATION. Duplicate idempotency keys return the
        original receipt (code DUPLICATE_COMMIT is not an error here).
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectCommitRequest" }
      responses:
        "200":
          description: Signed receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: Stale authorization or failed precondition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/abort:
    post:
      tags: [effects]
      operationId: effect.abort
      summary: Abort a pending effect before commit.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The effect, now in phase "aborted".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEffect" }
        default: { $ref: "#/components/responses/Error" }

  /v1/effects/{id}/compensate:
    post:
      tags: [effects]
      operationId: effect.compensate
      summary: Run the compensating action for a committed effect.
      parameters:
        - $ref: "#/components/parameters/EffectId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectCompensateRequest" }
      responses:
        "200":
          description: Compensating receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Error" }

  /v1/trace/query:
    get:
      tags: [trace]
      operationId: trace.query
      summary: Query the causal ledger.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: >
            Trace query, e.g.
            `effects where class >= compensatable and branch = "br-42"`.
        - name: episode
          in: query
          required: false
          schema: { type: string, pattern: "^ep-" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching trace entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceQueryResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/replay/{mode}:
    post:
      tags: [replay]
      operationId: replay.run
      summary: Replay an episode in audit, sandbox or live mode.
      description: |
        audit — play back the recorded ledger; never re-executes.
        sandbox — restore state and re-execute local code with recorded
        inputs substituted where captured.
        live — re-execute the same effect contracts against the real world.
        Live replay guarantees the contract, not the outcome.
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [audit, sandbox, live] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayRequest" }
      responses:
        "200":
          description: Replay report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayReport" }
        default: { $ref: "#/components/responses/Error" }

  /v1/receipts/{id}:
    get:
      tags: [receipts]
      operationId: receipt.get
      summary: Fetch a signed receipt.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^rcpt-" }
      responses:
        "200":
          description: Receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    EpisodeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^ep-" }
    StepId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^step-" }
    BranchId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^br-" }
    EffectId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^fx-" }

  responses:
    Denied:
      description: >
        Policy denial. Always carries the full structured Denial so a benign
        agent can repair itself (invariant: no denial without a
        machine-readable explanation).
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - required: [denial]
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable machine code, e.g. INVALID_ID, NOT_FOUND, DENIED,
            WRONG_EFFECT_PHASE, STALE_AUTHORIZATION, DUPLICATE_COMMIT,
            BACKEND_UNAVAILABLE, BRANCH_DISCARDED, MERGE_CONFLICT, STORAGE,
            CONNECTOR, SERDE, IO, OTHER.
        message: { type: string }
        denial: { $ref: "#/components/schemas/Denial" }

    ResourceBudget:
      type: object
      required:
        [cpu_ms, memory_bytes, network_bytes, tokens, cost_micro_usd, risk_units]
      properties:
        cpu_ms: { type: integer, minimum: 0 }
        memory_bytes: { type: integer, minimum: 0 }
        network_bytes: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        cost_micro_usd: { type: integer, minimum: 0 }
        risk_units: { type: integer, minimum: 0 }

    Constraint:
      description: Internally tagged by "kind" (ak-core Constraint).
      oneOf:
        - type: object
          required: [kind, value]
          properties:
            kind: { const: equals }
            value: {}
        - type: object
          required: [kind, values]
          properties:
            kind: { const: one_of }
            values: { type: array }
        - type: object
          required: [kind, pattern]
          properties:
            kind: { const: glob }
            pattern: { type: string }
        - type: object
          required: [kind, prefix]
          properties:
            kind: { const: prefix }
            prefix: { type: string }
        - type: object
          required: [kind, max]
          properties:
            kind: { const: max }
            max: { type: number }
        - type: object
          required: [kind]
          properties:
            kind: { const: forbidden }

    CapabilityLease:
      type: object
      required:
        [id, principal, operation, constraints, remaining_uses, issued_at,
         expires_at, budget, revoked]
      properties:
        id: { type: string, pattern: "^lease-" }
        principal: { type: string, pattern: "^pr-" }
        operation: { type: string }
        constraints:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Constraint" }
        remaining_uses: { type: integer, minimum: 0 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        bound_branch: { type: string, pattern: "^br-" }
        budget: { $ref: "#/components/schemas/ResourceBudget" }
        parent_lease: { type: string, pattern: "^lease-" }
        preconditions: { type: object }
        revoked: { type: boolean }

    DenialCode:
      type: string
      enum:
        - CAPABILITY_DENIED
        - CAPABILITY_EXPIRED
        - CAPABILITY_EXHAUSTED
        - BUDGET_EXHAUSTED
        - CONSTRAINT_VIOLATED
        - BRANCH_MISMATCH
        - EFFECT_REQUIRES_APPROVAL
        - STALE_AUTHORIZATION
        - PRECONDITION_FAILED
        - DUPLICATE_COMMIT
        - BACKEND_UNAVAILABLE
        - POLICY_FORBIDDEN

    RequestableScope:
      type: object
      required: [operation, constraints, requires_human]
      properties:
        operation: { type: string }
        constraints: {}
        requires_human: { type: boolean }

    Denial:
      type: object
      required: [code, attempted_operation, reason, escalation_allowed]
      properties:
        code: { $ref: "#/components/schemas/DenialCode" }
        attempted_operation: { type: string }
        reason: { type: string }
        safe_alternatives:
          type: array
          items: { type: string }
        requestable_scopes:
          type: array
          items: { $ref: "#/components/schemas/RequestableScope" }
        escalation_allowed: { type: boolean }

    ActionKind:
      description: Internally tagged by "kind" (ak-core ActionKind).
      oneOf:
        - type: object
          required: [kind, command]
          properties:
            kind: { const: shell }
            command: { type: string }
            cwd: { type: [string, "null"] }
            env:
              type: object
              additionalProperties: { type: string }
        - type: object
          required: [kind, path]
          properties:
            kind: { const: read_file }
            path: { type: string }
        - type: object
          required: [kind, path, contents_b64]
          properties:
            kind: { const: write_file }
            path: { type: string }
            contents_b64: { type: string }
        - type: object
          required: [kind, path]
          properties:
            kind: { const: delete_path }
            path: { type: string }
        - type: object
          required: [kind, url]
          properties:
            kind: { const: http_read }
            url: { type: string }
        - type: object
          required: [kind, server, tool, arguments]
          properties:
            kind: { const: mcp_invoke }
            server: { type: string }
            tool: { type: string }
            arguments: {}
        - type: object
          required: [kind, connector, operation, params]
          properties:
            kind: { const: connector_op }
            connector: { type: string }
            operation: { type: string }
            params: {}
        - type: object
          required: [kind, query]
          properties:
            kind: { const: trace_query }
            query: { type: string }
        - type: object
          required: [kind, since]
          properties:
            kind: { const: branch_diff }
            since: { type: string, pattern: "^st-" }

    Action:
      type: object
      required: [kind, lease, budget]
      properties:
        kind: { $ref: "#/components/schemas/ActionKind" }
        lease: { type: string, pattern: "^lease-" }
        intent_hint: { type: string }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    Observation:
      description: Internally tagged by "kind" (ak-core Observation).
      oneOf:
        - type: object
          required: [kind, summary, exit_code, full_output, truncated]
          properties:
            kind: { const: success }
            summary: { type: string }
            data: {}
            stdout_head: { type: string }
            exit_code: { type: integer }
            full_output: { type: string }
            truncated: { type: boolean }
        - type: object
          required: [kind, summary, exit_code, full_output]
          properties:
            kind: { const: failure }
            summary: { type: string }
            exit_code: { type: integer }
            first_causal_failure: { type: string }
            full_output: { type: string }
        - type: object
          required: [kind, denial]
          properties:
            kind: { const: denied }
            denial: { $ref: "#/components/schemas/Denial" }
        - type: object
          required: [kind, effect, contract_hash, class]
          properties:
            kind: { const: effect_pending }
            effect: { type: string, pattern: "^fx-" }
            contract_hash: { type: string }
            class: { $ref: "#/components/schemas/EffectClass" }
        - type: object
          required: [kind, receipt]
          properties:
            kind: { const: effect_committed }
            receipt: { type: string, pattern: "^rcpt-" }

    EffectClass:
      type: string
      enum:
        - pure
        - local_reversible
        - remote_reversible
        - compensatable
        - irreversible
        - opaque_external

    EffectContract:
      type: object
      required:
        [operation, resource, arguments, preconditions, idempotency_key, class]
      properties:
        operation: { type: string }
        resource: { type: string }
        arguments: {}
        preconditions: {}
        idempotency_key: { type: string }
        class: { $ref: "#/components/schemas/EffectClass" }

    EffectPhase:
      description: Internally tagged by "phase" (ak-core EffectPhase).
      oneOf:
        - type: object
          required: [phase]
          properties:
            phase: { const: proposed }
        - type: object
          required: [phase, preview]
          properties:
            phase: { const: prepared }
            preview: {}
        - type: object
          required: [phase, approver, approved_at, policy_epoch]
          properties:
            phase: { const: approved }
            approver: { type: string, pattern: "^pr-" }
            approved_at: { type: string, format: date-time }
            policy_epoch: { type: integer }
        - type: object
          required: [phase, receipt]
          properties:
            phase: { const: committed }
            receipt: { type: string, pattern: "^rcpt-" }
        - type: object
          required: [phase, reason]
          properties:
            phase: { const: aborted }
            reason: { type: string }
        - type: object
          required: [phase, compensating_receipt]
          properties:
            phase: { const: compensated }
            compensating_receipt: { type: string, pattern: "^rcpt-" }

    PendingEffect:
      type: object
      required:
        [id, contract, contract_hash, proposer, branch, step, lease, phase,
         proposed_at]
      properties:
        id: { type: string, pattern: "^fx-" }
        contract: { $ref: "#/components/schemas/EffectContract" }
        contract_hash: { type: string }
        proposer: { type: string, pattern: "^pr-" }
        branch: { type: string, pattern: "^br-" }
        step: { type: string, pattern: "^step-" }
        lease: { type: string, pattern: "^lease-" }
        phase: { $ref: "#/components/schemas/EffectPhase" }
        proposed_at: { type: string, format: date-time }

    ReceiptBody:
      type: object
      required:
        [effect, who, operation, resource, contract_hash, branch, step,
         policy_epoch, authorization_witness, external_response_digest,
         committed_at]
      properties:
        effect: { type: string, pattern: "^fx-" }
        who: { type: string, pattern: "^pr-" }
        operation: { type: string }
        resource: { type: string }
        contract_hash: { type: string }
        branch: { type: string, pattern: "^br-" }
        step: { type: string, pattern: "^step-" }
        policy_epoch: { type: integer }
        authorization_witness: { type: string }
        external_response_digest: { type: string }
        committed_at: { type: string, format: date-time }

    Receipt:
      type: object
      required: [id, body, signature, key_id]
      properties:
        id: { type: string, pattern: "^rcpt-" }
        body: { $ref: "#/components/schemas/ReceiptBody" }
        signature:
          type: string
          description: Ed25519 over canonical_json(body), hex-encoded.
        key_id: { type: string }

    FileChange:
      description: Internally tagged by "op" (ak-core FileChange).
      oneOf:
        - type: object
          required: [op, path, blob, mode]
          properties:
            op: { const: added }
            path: { type: string }
            blob: { type: string }
            mode: { type: integer }
        - type: object
          required: [op, path, old_blob, new_blob]
          properties:
            op: { const: modified }
            path: { type: string }
            old_blob: { type: string }
            new_blob: { type: string }
        - type: object
          required: [op, path, old_blob]
          properties:
            op: { const: deleted }
            path: { type: string }
            old_blob: { type: string }

    StateDelta:
      type: object
      required: [policy_epoch]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileChange" }
        processes_started:
          type: array
          items: { type: string }
        processes_exited:
          type: array
          items: { type: string }
        tool_sessions:
          type: array
          items: { type: string }
        policy_epoch: { type: integer }
        effects_proposed:
          type: array
          items: { type: string, pattern: "^fx-" }
        effects_committed:
          type: array
          items: { type: string, pattern: "^rcpt-" }

    ReplayClass:
      type: string
      enum:
        - audit_only
        - filesystem_only
        - process_and_filesystem
        - framework_host_calls
        - browser_profile

    StateNode:
      type: object
      required:
        [id, episode, branch, actor, delta, workspace_root, replay_class,
         created_at]
      properties:
        id: { type: string, pattern: "^st-" }
        episode: { type: string, pattern: "^ep-" }
        branch: { type: string, pattern: "^br-" }
        parent: { type: string, pattern: "^st-" }
        produced_by: { type: string, pattern: "^step-" }
        merge_parent: { type: string, pattern: "^st-" }
        actor: { type: string, pattern: "^pr-" }
        delta: { $ref: "#/components/schemas/StateDelta" }
        workspace_root: { type: string }
        replay_class: { $ref: "#/components/schemas/ReplayClass" }
        created_at: { type: string, format: date-time }

    Episode:
      type: object
      required: [id, title, owner, root_state, main_branch, budget, created_at]
      properties:
        id: { type: string, pattern: "^ep-" }
        title: { type: string }
        owner: { type: string, pattern: "^pr-" }
        root_state: { type: string, pattern: "^st-" }
        main_branch: { type: string, pattern: "^br-" }
        budget: { $ref: "#/components/schemas/ResourceBudget" }
        created_at: { type: string, format: date-time }

    Branch:
      type: object
      required: [id, episode, forked_from, head, discarded, created_at]
      properties:
        id: { type: string, pattern: "^br-" }
        episode: { type: string, pattern: "^ep-" }
        parent_branch: { type: string, pattern: "^br-" }
        forked_from: { type: string, pattern: "^st-" }
        head: { type: string, pattern: "^st-" }
        discarded: { type: boolean }
        created_at: { type: string, format: date-time }

    EpisodeCreateRequest:
      type: object
      required: [title, owner, budget]
      properties:
        title: { type: string }
        owner: { type: string, pattern: "^pr-" }
        budget: { $ref: "#/components/schemas/ResourceBudget" }
        workspace_root: { type: string }

    EpisodeCreateResponse:
      type: object
      required: [episode, main_branch]
      properties:
        episode: { $ref: "#/components/schemas/Episode" }
        main_branch: { $ref: "#/components/schemas/Branch" }

    EpisodeDescribeResponse:
      type: object
      required: [episode, branches, step_count, pending_effects, budget_remaining]
      properties:
        episode: { $ref: "#/components/schemas/Episode" }
        branches:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        step_count: { type: integer }
        pending_effects: { type: integer }
        budget_remaining: { $ref: "#/components/schemas/ResourceBudget" }

    StepExecuteRequest:
      type: object
      required: [branch, actor, action]
      properties:
        branch: { type: string, pattern: "^br-" }
        actor: { type: string, pattern: "^pr-" }
        action: { $ref: "#/components/schemas/Action" }

    StepExecuteResponse:
      type: object
      required: [step, observation, usage]
      properties:
        step: { type: string, pattern: "^step-" }
        observation: { $ref: "#/components/schemas/Observation" }
        produced_state: { type: string, pattern: "^st-" }
        usage: { $ref: "#/components/schemas/ResourceBudget" }

    TraceEntry:
      type: object
      required:
        [step, episode, branch, actor, action, lease, observation, usage,
         started_at, finished_at]
      properties:
        step: { type: string, pattern: "^step-" }
        episode: { type: string, pattern: "^ep-" }
        branch: { type: string, pattern: "^br-" }
        actor: { type: string, pattern: "^pr-" }
        action: { $ref: "#/components/schemas/ActionKind" }
        lease: { type: string, pattern: "^lease-" }
        observation: { $ref: "#/components/schemas/Observation" }
        produced_state: { type: string, pattern: "^st-" }
        usage: { $ref: "#/components/schemas/ResourceBudget" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    StepExplainResponse:
      type: object
      required: [entry, lease, constraint_checks, backend, backend_rationale]
      properties:
        entry: { $ref: "#/components/schemas/TraceEntry" }
        lease: { $ref: "#/components/schemas/CapabilityLease" }
        constraint_checks:
          type: object
          additionalProperties: { type: string }
        backend: { type: string }
        backend_rationale: { type: string }

    StepRetryRequest:
      type: object
      properties:
        branch: { type: string, pattern: "^br-" }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    BranchForkRequest:
      type: object
      properties:
        from_state: { type: string, pattern: "^st-" }
        count: { type: integer, minimum: 1, default: 1 }

    BranchForkResponse:
      type: object
      required: [branches]
      properties:
        branches:
          type: array
          items: { $ref: "#/components/schemas/Branch" }

    BranchDiffRequest:
      type: object
      properties:
        since: { type: string, pattern: "^st-" }

    BranchDiffResponse:
      type: object
      required: [delta, summary]
      properties:
        delta: { $ref: "#/components/schemas/StateDelta" }
        summary: { type: string }

    BranchCompareResponse:
      type: object
      required: [common_ancestor, left_delta, right_delta, conflicting_paths]
      properties:
        common_ancestor: { type: string, pattern: "^st-" }
        left_delta: { $ref: "#/components/schemas/StateDelta" }
        right_delta: { $ref: "#/components/schemas/StateDelta" }
        conflicting_paths:
          type: array
          items: { type: string }

    BranchMergeRequest:
      type: object
      required: [into]
      properties:
        into: { type: string, pattern: "^br-" }
        require_clean: { type: boolean, default: false }

    BranchMergeResponse:
      type: object
      description: Exactly one of merged / conflict is present.
      properties:
        merged: { $ref: "#/components/schemas/StateNode" }
        conflict:
          type: object
          required: [paths]
          properties:
            paths:
              type: array
              items: { type: string }

    BranchDiscardRequest:
      type: object
      properties:
        reason: { type: string }

    CapabilityDescribeResponse:
      type: object
      required: [leases]
      properties:
        leases:
          type: array
          items: { $ref: "#/components/schemas/CapabilityLease" }

    CapabilityRequestRequest:
      type: object
      required: [principal, operation]
      properties:
        principal: { type: string, pattern: "^pr-" }
        operation: { type: string }
        constraints:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Constraint" }
        uses: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        budget: { $ref: "#/components/schemas/ResourceBudget" }
        bound_branch: { type: string, pattern: "^br-" }
        justification: { type: string }

    CapabilityRequestResponse:
      type: object
      description: Exactly one of lease / denial / pending_approval_id.
      properties:
        lease: { $ref: "#/components/schemas/CapabilityLease" }
        denial: { $ref: "#/components/schemas/Denial" }
        pending_approval_id: { type: string }

    CapabilityDelegateRequest:
      type: object
      required: [parent_lease, child_principal, constraints, uses, expires_at, budget]
      properties:
        parent_lease: { type: string, pattern: "^lease-" }
        child_principal: { type: string, pattern: "^pr-" }
        constraints:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Constraint" }
        uses: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        budget: { $ref: "#/components/schemas/ResourceBudget" }

    CapabilityRevokeRequest:
      type: object
      required: [lease]
      properties:
        lease: { type: string, pattern: "^lease-" }
        cascade: { type: boolean, default: false }
        reason: { type: string }

    CapabilityRevokeResponse:
      type: object
      required: [revoked_leases]
      properties:
        revoked_leases:
          type: array
          items: { type: string, pattern: "^lease-" }

    EffectProposeRequest:
      type: object
      required: [contract, proposer, branch]
      properties:
        contract: { $ref: "#/components/schemas/EffectContract" }
        proposer: { type: string, pattern: "^pr-" }
        branch: { type: string, pattern: "^br-" }
        step: { type: string }
        lease: { type: string }

    EffectProposeResponse:
      type: object
      description: Exactly one of effect / denial.
      properties:
        effect: { $ref: "#/components/schemas/PendingEffect" }
        denial: { $ref: "#/components/schemas/Denial" }

    EffectApproveRequest:
      type: object
      required: [approver, contract_hash]
      properties:
        approver: { type: string, pattern: "^pr-" }
        contract_hash:
          type: string
          description: Approving an effect means approving exactly this hash.

    EffectCommitRequest:
      type: object
      required: [expected_contract_hash]
      properties:
        expected_contract_hash: { type: string }

    EffectCompensateRequest:
      type: object
      properties:
        reason: { type: string }

    EffectPrepareResponse:
      type: object
      required: [preview, observed_preconditions, effect]
      properties:
        preview: {}
        observed_preconditions: {}
        effect: { $ref: "#/components/schemas/PendingEffect" }

    TraceQueryResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TraceEntry" }
        next_page_token: { type: string }

    ReplayRequest:
      type: object
      required: [episode]
      properties:
        episode: { type: string, pattern: "^ep-" }
        from_step: { type: string, pattern: "^step-" }
        to_step: { type: string, pattern: "^step-" }

    ReplayDivergence:
      type: object
      required: [step, layer, recorded_digest, replayed_digest, detail]
      properties:
        step: { type: string, pattern: "^step-" }
        layer:
          type: string
          enum: [observation, state, effect_contract, effect_outcome]
        recorded_digest: { type: string }
        replayed_digest: { type: string }
        detail: { type: string }

    ReplayReport:
      type: object
      required: [episode, mode, effective_class, steps_replayed, divergences, completed_at]
      properties:
        episode: { type: string, pattern: "^ep-" }
        mode: { type: string, enum: [audit, sandbox, live] }
        effective_class: { $ref: "#/components/schemas/ReplayClass" }
        steps_replayed: { type: integer }
        divergences:
          type: array
          items: { $ref: "#/components/schemas/ReplayDivergence" }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
        completed_at: { type: string, format: date-time }
